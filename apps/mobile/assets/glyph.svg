<!--
  The piggy on its own, no background — the transparent companion to icon.svg.
  Feeds the Android adaptive foreground, the splash logo and the web favicon, all of which
  composite over a colour supplied by app.json rather than baking one in.

  Same artwork as icon.svg with three differences. If you edit the artwork, edit it in both.
   • No ground and no sheen, obviously — and no contact shadow either. A shadow needs a
     surface to fall on; over a supplied background it is just a smudge.
   • Scaled to 85% and re-centred. An Android launcher can crop everything outside the central
     66% of an adaptive icon, and the full-bleed composition would lose the feet and the ear.
   • The eye, nostril and slot are filled in app.json's OWN background (#0C0A16) rather than
     in the ground's violet, because that is what they have to look like holes against here.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F0FF"/>
      <stop offset="1" stop-color="#CFC2FF"/>
    </linearGradient>

    <linearGradient id="behind" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#EFEAFF"/>
      <stop offset="1" stop-color="#C9BAFF"/>
    </linearGradient>

    <radialGradient id="hilite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B54E8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6B54E8" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="bodyClip">
      <ellipse cx="512" cy="574" rx="300" ry="238"/>
    </clipPath>
  </defs>

  <!-- Artwork spans x 168–884 and y 283–866, centred on (526, 574); pull that to the canvas
       centre, then shrink it into the safe zone. -->
  <g transform="translate(512,512) scale(0.85) translate(-526,-574)">
    <path d="M 572 362 L 670 298 L 682 404 Z" fill="url(#behind)" stroke="#D8CEFF"
          stroke-width="30" stroke-linejoin="round"/>
    <path d="M 220 478 q -66 -30 -28 -90" fill="none" stroke="#E2DAFF"
          stroke-width="34" stroke-linecap="round"/>
    <rect x="336" y="762" width="102" height="104" rx="38" fill="url(#behind)"/>
    <rect x="598" y="762" width="102" height="104" rx="38" fill="url(#behind)"/>

    <ellipse cx="512" cy="574" rx="300" ry="238" fill="url(#body)"/>

    <g clip-path="url(#bodyClip)">
      <ellipse cx="410" cy="450" rx="248" ry="168" fill="url(#hilite)" opacity="0.5"/>
      <ellipse cx="596" cy="786" rx="290" ry="164" fill="url(#shade)"/>
    </g>

    <ellipse cx="806" cy="610" rx="78" ry="60" fill="#FFFFFF"/>
    <ellipse cx="806" cy="626" rx="78" ry="44" fill="url(#shade)"/>

    <circle cx="806" cy="610" r="18" fill="#0C0A16"/>
    <circle cx="668" cy="520" r="28" fill="#0C0A16"/>

    <rect x="416" y="368" width="184" height="40" rx="20" fill="#0C0A16"/>
  </g>
</svg>
