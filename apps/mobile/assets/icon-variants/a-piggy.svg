<!--
  Variant A — the piggy, given the iOS treatment.

  Same subject as the current icon, three changes that are what actually makes an icon read
  as native:
   • The ground is BRIGHT. Apple's own icons are saturated fields; a near-black icon reads as
     a hole on a light wallpaper and as nothing at all on a dark one.
   • One colour for the subject. The current icon paints the pig in a violet ramp on a violet
     ground, so the silhouette has to be found rather than seen. White separates at 40px.
   • The coin is gone. At the size this is actually looked at, the coin and the pig fight for
     the same glance; the slot alone carries "money goes in".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A99BFF"/>
      <stop offset="0.52" stop-color="#8067F5"/>
      <stop offset="1" stop-color="#5B45D6"/>
    </linearGradient>

    <!-- Light dropped in from the top-left, the direction every iOS icon is lit from. -->
    <radialGradient id="sheen" cx="0.26" cy="0.16" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- The body is white, but not flatly: a touch cooler along the bottom so it reads round
         instead of as a sticker. -->
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E1FF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- Painted back to front: ear, tail and legs first, so the body overlaps them. -->
  <g transform="translate(6,26)">
    <path d="M 566 336 L 664 272 L 676 378 Z" fill="#E7E1FF" stroke="#E7E1FF"
          stroke-width="30" stroke-linejoin="round"/>
    <path d="M 214 452 q -66 -30 -28 -90" fill="none" stroke="#E7E1FF"
          stroke-width="32" stroke-linecap="round"/>
    <rect x="330" y="736" width="102" height="104" rx="38" fill="#E7E1FF"/>
    <rect x="592" y="736" width="102" height="104" rx="38" fill="#E7E1FF"/>

    <ellipse cx="506" cy="548" rx="300" ry="238" fill="url(#body)"/>
    <ellipse cx="800" cy="584" rx="78" ry="60" fill="#FFFFFF"/>

    <!-- Cut in the ground's own colour, so they read as holes in the body rather than as
         a third colour added to the icon. -->
    <circle cx="800" cy="584" r="18" fill="#6B54E8"/>
    <circle cx="662" cy="494" r="28" fill="#6B54E8"/>
    <rect x="410" y="342" width="184" height="40" rx="20" fill="#5B45D6"/>
  </g>
</svg>
