<!--
  Save n Spend app icon — the source of truth.

  A piggy bank with a coin slot in its back. Renders to the PNGs beside it:
  npm run icons   (see scripts/build-icons.sh)

  Palette is the app's own violet ramp, from theme/colors.ts and theme/gradients.ts.

  Notes on decisions that aren't obvious:
   • Full bleed, no rounded corners. iOS applies its own squircle mask, and a pre-rounded
     icon shows dark wedges inside it.
   • The ground is BRIGHT violet, not the app's dark surface. A near-black icon reads as a
     hole on a light wallpaper and disappears entirely on a dark one.
   • The subject is one colour. Painting the pig in the same violet ramp as the ground means
     the silhouette has to be found rather than seen; white separates at 40px.
   • No coin, though the metaphor wants one. At the size this is actually looked at the coin
     and the pig compete for the same glance, and the slot alone carries "money goes in".
   • Every soft edge is a radial gradient, not a blur filter. librsvg's filter support is the
     one part of this pipeline not worth depending on.
   • The eye, nostril and slot are filled in the GROUND's colour so they read as holes in the
     body rather than as extra colours in the icon. If the ground changes, they change.
   • The composition sits low and slightly right of centre: the ear and tail push the visual
     mass up and left, so a mathematically centred pig looks like it is sliding off.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Diagonal, and over a wide range: it puts the light corner next to the dark one, which
         is what reads as depth rather than as a tint. -->
    <linearGradient id="ground" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#B7ABFF"/>
      <stop offset="0.46" stop-color="#8067F5"/>
      <stop offset="1" stop-color="#452FBE"/>
    </linearGradient>

    <!-- Light dropped in from the top-left, the direction every iOS icon is lit from. -->
    <radialGradient id="sheen" cx="0.26" cy="0.14" r="0.86">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="body" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F0FF"/>
      <stop offset="1" stop-color="#CFC2FF"/>
    </linearGradient>

    <!-- Ear, tail and legs sit behind the body, so they are shaded down as a set. Given the
         body's own fill they'd read as the same surface and the silhouette would go flat. -->
    <linearGradient id="behind" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#EFEAFF"/>
      <stop offset="1" stop-color="#C9BAFF"/>
    </linearGradient>

    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2B1A6E" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#2B1A6E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2B1A6E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hilite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B54E8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6B54E8" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="bodyClip">
      <ellipse cx="512" cy="574" rx="300" ry="238"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- The contact shadow, under the feet. This is what makes the pig sit ON the ground
       instead of floating in front of it. -->
  <ellipse cx="516" cy="892" rx="300" ry="58" fill="url(#shadow)"/>

  <!-- Painted back to front: ear, tail and legs first, so the body overlaps them and they
       read as behind it. -->
  <g>
    <!-- Ear. Stroked in its own fill with a round join, which is the cheap way to round a
         triangle's corners — a sharp point here reads as a horn. -->
    <path d="M 572 362 L 670 298 L 682 404 Z" fill="url(#behind)" stroke="#D8CEFF"
          stroke-width="30" stroke-linejoin="round"/>
    <path d="M 220 478 q -66 -30 -28 -90" fill="none" stroke="#E2DAFF"
          stroke-width="34" stroke-linecap="round"/>
    <rect x="336" y="762" width="102" height="104" rx="38" fill="url(#behind)"/>
    <rect x="598" y="762" width="102" height="104" rx="38" fill="url(#behind)"/>

    <ellipse cx="512" cy="574" rx="300" ry="238" fill="url(#body)"/>

    <!-- Clipped to the body, so the turn of the surface stays on the surface. -->
    <g clip-path="url(#bodyClip)">
      <ellipse cx="410" cy="450" rx="248" ry="168" fill="url(#hilite)" opacity="0.5"/>
      <ellipse cx="596" cy="786" rx="290" ry="164" fill="url(#shade)"/>
    </g>

    <!-- The snout, lit on its own so it reads as nearer than the body. -->
    <ellipse cx="806" cy="610" rx="78" ry="60" fill="#FFFFFF"/>
    <ellipse cx="806" cy="626" rx="78" ry="44" fill="url(#shade)"/>

    <circle cx="806" cy="610" r="18" fill="#6B54E8"/>
    <circle cx="668" cy="520" r="28" fill="#5B45D6"/>

    <!-- The slot. The darker top edge gives it a lip; without it the shape reads as a sticker
         laid on the back rather than an opening cut into it. -->
    <rect x="416" y="368" width="184" height="40" rx="20" fill="#4E3AC9"/>
    <rect x="416" y="368" width="184" height="18" rx="9" fill="#3B2A9E" opacity="0.55"/>
  </g>
</svg>
